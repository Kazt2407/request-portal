# Local Kubernetes cluster for the services: k3d runs k3s in Docker. The infrastructure stays in
# infra/docker-compose.yml; pods reach it as host.k3d.internal. Created by scripts/k3d-up.sh.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: request-portal
servers: 1
agents: 0
ports:
  # The bundled Traefik ingress serves the web app at http://localhost:8088 and the API at /api
  - port: 8088:80
    nodeFilters:
      - loadbalancer
