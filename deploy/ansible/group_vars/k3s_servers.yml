# Pinned versions. Rancher 2.15 supports Kubernetes below 1.37; k3s stays one minor release behind the newest.
k3s_version: v1.35.9+k3s1
helm_version: v4.3.1
cert_manager_version: v1.21.2
rancher_version: 2.15.2

# Public name of the Rancher UI; it must resolve to the server.
rancher_hostname: rancher.example.edu
# "rancher" issues a self-signed certificate; "letsEncrypt" needs rancher_letsencrypt_email and public port 80.
rancher_tls_source: rancher
rancher_letsencrypt_email: ""

# Keep the admin bootstrap password in an encrypted file, for example:
#   ansible-vault create group_vars/k3s_servers.vault.yml   (with vault_rancher_bootstrap_password: ...)
rancher_bootstrap_password: "{{ vault_rancher_bootstrap_password }}"

k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
