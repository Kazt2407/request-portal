- name: Install Helm {{ helm_version }}
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - --strip-components=1
      - linux-amd64/helm
    creates: /usr/local/bin/helm

- name: Add the cert-manager and Rancher chart repositories
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
  loop:
    - { name: jetstack, url: "https://charts.jetstack.io" }
    - { name: rancher-stable, url: "https://releases.rancher.com/server-charts/stable" }

- name: Install cert-manager {{ cert_manager_version }}
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_version }}"
    release_namespace: cert-manager
    create_namespace: true
    kubeconfig: "{{ k3s_kubeconfig }}"
    values:
      crds:
        enabled: true
    wait: true

- name: Install Rancher {{ rancher_version }}
  kubernetes.core.helm:
    name: rancher
    chart_ref: rancher-stable/rancher
    chart_version: "{{ rancher_version }}"
    release_namespace: cattle-system
    create_namespace: true
    kubeconfig: "{{ k3s_kubeconfig }}"
    values:
      hostname: "{{ rancher_hostname }}"
      bootstrapPassword: "{{ rancher_bootstrap_password }}"
      replicas: 1
      ingress:
        tls:
          source: "{{ rancher_tls_source }}"
      letsEncrypt:
        email: "{{ rancher_letsencrypt_email }}"
        ingress:
          class: traefik
    wait: true
    wait_timeout: 10m
  no_log: true # the values contain the bootstrap password

- name: Show where Rancher is
  ansible.builtin.debug:
    msg: "Rancher is starting at https://{{ rancher_hostname }} (sign in as admin with the bootstrap password)."
