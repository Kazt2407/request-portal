- name: Download the k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

# Runs only when k3s is not installed yet; to upgrade, change k3s_version and remove /usr/local/bin/k3s.
- name: Install k3s {{ k3s_version }}
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server --write-kubeconfig-mode 0600 --tls-san {{ rancher_hostname }}"
  args:
    creates: /usr/local/bin/k3s

- name: Wait until the node is ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Copy the kubeconfig to this machine
  ansible.builtin.fetch:
    src: "{{ k3s_kubeconfig }}"
    dest: "{{ playbook_dir }}/kubeconfig-{{ inventory_hostname }}.yaml"
    flat: true
