spring:
  application:
    name: org-service
  datasource:
    # Defaults match infra/docker-compose.yml; override with SPRING_DATASOURCE_* in other environments.
    url: jdbc:postgresql://localhost:5433/org_db
    username: org_service
    password: org_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_batch_fetch_size: 50
  flyway:
    # db/dev-data holds sample departments; production sets SPRING_FLYWAY_LOCATIONS=classpath:db/migration.
    locations: classpath:db/migration,classpath:db/dev-data
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${portal.keycloak.issuer-uri}
          jwk-set-uri: ${portal.keycloak.base-url}/realms/${portal.keycloak.realm}/protocol/openid-connect/certs
          audiences: request-portal-api
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: org-service
            # Dev secret from infra/keycloak/realm-request-portal.json; real environments set KEYCLOAK_ADMIN_CLIENT_SECRET.
            client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:org-service-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${portal.keycloak.base-url}/realms/${portal.keycloak.realm}/protocol/openid-connect/token

portal:
  keycloak:
    # Where this service reaches Keycloak (inside Docker/Kubernetes this is the internal hostname)...
    base-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: request-portal
    # ...and the issuer printed in tokens, which is the public URL browsers use.
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/request-portal}

server:
  port: 8081

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # Spans are always created (trace ids appear in logs); exporting needs a collector, so it is opt-in.
    export:
      enabled: ${OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
  metrics:
    distribution:
      # Histogram buckets, so dashboards can compute p95 and p99 across replicas.
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
