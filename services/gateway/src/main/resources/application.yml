spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Issuer printed in tokens (public URL) vs. where keys are fetched (may be an internal hostname).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/request-portal}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/request-portal/protocol/openid-connect/certs
          audiences: request-portal-api
  cloud:
    gateway:
      server:
        webflux:
          # Token bucket per user in Redis: a sustained rate with room for short bursts. Over the limit the
          # gateway answers 429; if Redis is unreachable it lets requests through rather than failing the API.
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_PER_SECOND:10}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:30}
                key-resolver: "#{@userKeyResolver}"
          routes:
            - id: org-service
              uri: ${ORG_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/accounts/**,/api/v1/departments/**,/api/v1/terms/**,/api/v1/profiles/**
            - id: request-service
              uri: ${REQUEST_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/templates/**,/api/v1/requests/**
            # Filling a form builds a Word document, so it gets a tighter per-user limit of its own.
            - id: form-documents
              uri: ${DOCUMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/forms/*/document
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${FORM_RATE_LIMIT_PER_SECOND:1}
                    redis-rate-limiter.burstCapacity: ${FORM_RATE_LIMIT_BURST:5}
                    key-resolver: "#{@userKeyResolver}"
            - id: document-service
              uri: ${DOCUMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/files/**,/api/v1/forms/**,/api/v1/exports/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/notifications/**

server:
  port: 8080

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # Spans are always created (trace ids appear in logs); exporting needs a collector, so it is opt-in.
    export:
      enabled: ${OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
  metrics:
    distribution:
      # Histogram buckets, so dashboards can compute p95 and p99 across replicas.
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
