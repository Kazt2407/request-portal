spring:
  application:
    name: document-service
  datasource:
    # Defaults match infra/docker-compose.yml; override with SPRING_DATASOURCE_* in other environments.
    url: jdbc:postgresql://localhost:5433/document_db
    username: document_service
    password: document_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/request-portal}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/request-portal/protocol/openid-connect/certs
          audiences: request-portal-api

server:
  port: 8083

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # Spans are always created (trace ids appear in logs); exporting needs a collector, so it is opt-in.
    export:
      enabled: ${OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
  metrics:
    distribution:
      # Histogram buckets, so dashboards can compute p95 and p99 across replicas.
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
