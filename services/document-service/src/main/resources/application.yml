spring:
  application:
    name: document-service
  datasource:
    # Defaults match infra/docker-compose.yml; override with SPRING_DATASOURCE_* in other environments.
    url: jdbc:postgresql://localhost:5433/document_db
    username: document_service
    password: document_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: document-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer: # for the dead-letter topic
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/request-portal}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/request-portal/protocol/openid-connect/certs
          audiences: request-portal-api

portal:
  storage:
    # S3 endpoint this service calls, and the one put into pre-signed URLs for clients. Both empty in AWS.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9010}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9010}
    region: ${STORAGE_REGION:ap-southeast-1}
    bucket: ${STORAGE_BUCKET:request-portal}
    # Local development keys from infra/docker-compose.yml; leave empty to use the AWS credential chain.
    access-key: ${STORAGE_ACCESS_KEY:portal}
    secret-key: ${STORAGE_SECRET_KEY:portal-storage-secret}
    # Bucket in the path (S3-compatible stores) rather than the host name (AWS).
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
    create-bucket: ${STORAGE_CREATE_BUCKET:true}
    # Origins of the web app (Vite dev server, local k3d), allowed to upload and download directly.
    cors-allowed-origins: ${STORAGE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088}
    url-ttl: 15m
  files:
    max-size: 20MB
    # Uploads never attached to a request are deleted after this long.
    unattached-ttl: 24h
    cleanup-interval: 1h
  bulk-downloads:
    max-requests: 500
    max-files: 2000
    max-size: 2GB
    # Archives are deleted this long after they are ready (also an S3 lifecycle rule in AWS).
    ttl: 3d
    poll-interval: 2s
    # A job still running after this long is assumed abandoned (crashed instance) and retried.
    stale-after: 30m
  org-service:
    url: ${ORG_SERVICE_URL:http://localhost:8081}
  # Time zone for "today" on generated forms.
  time-zone: Asia/Ho_Chi_Minh
  events:
    topic: request-events
    dead-letter-topic: request-events.document-service.DLT
    partitions: 3
    replicas: 1

server:
  port: 8083

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # Spans are always created (trace ids appear in logs); exporting needs a collector, so it is opt-in.
    export:
      enabled: ${OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
  metrics:
    distribution:
      # Histogram buckets, so dashboards can compute p95 and p99 across replicas.
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
