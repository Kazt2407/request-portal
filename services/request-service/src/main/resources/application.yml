spring:
  application:
    name: request-service
  datasource:
    # Defaults match infra/docker-compose.yml; override with SPRING_DATASOURCE_* in other environments.
    url: jdbc:postgresql://localhost:5433/request_db
    username: request_service
    password: request_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_batch_fetch_size: 50
  flyway:
    # db/dev-data holds sample templates; production sets SPRING_FLYWAY_LOCATIONS=classpath:db/migration.
    locations: classpath:db/migration,classpath:db/dev-data
  data:
    web:
      pageable:
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/request-portal}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/request-portal/protocol/openid-connect/certs
          audiences: request-portal-api

portal:
  outbox:
    topic: request-events
    partitions: 3
    replicas: 1
    poll-interval: 500ms
    batch-size: 100
    send-timeout: 15s
    retention: 7d
    cleanup-cron: "0 15 3 * * *"
  org-service:
    url: ${ORG_SERVICE_URL:http://localhost:8081}
  document-service:
    url: ${DOCUMENT_SERVICE_URL:http://localhost:8083}
  time-zone: Asia/Ho_Chi_Minh

server:
  port: 8082

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # Spans are always created (trace ids appear in logs); exporting needs a collector, so it is opt-in.
    export:
      enabled: ${OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
  observations:
    enable:
      # Polling jobs run every few seconds; tracing each run would bury the real traces. The outbox relay
      # still traces each publish as part of the request that caused it.
      tasks.scheduled.execution: false
  metrics:
    distribution:
      # Histogram buckets, so dashboards can compute p95 and p99 across replicas.
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
