spring:
  application:
    name: request-service
  datasource:
    # Defaults match infra/docker-compose.yml; override with SPRING_DATASOURCE_* in other environments.
    url: jdbc:postgresql://localhost:5433/request_db
    username: request_service
    password: request_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
