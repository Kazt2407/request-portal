spring:
  application:
    name: notification-service
  datasource:
    # Defaults match infra/docker-compose.yml; override with SPRING_DATASOURCE_* in other environments.
    url: jdbc:postgresql://localhost:5433/notification_db
    username: notification_service
    password: notification_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer: # for the dead-letter topic
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      concurrency: 3
      # Continue the trace started by the HTTP request that caused the event (traceparent header).
      observation-enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/request-portal}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/request-portal/protocol/openid-connect/certs
          audiences: request-portal-api
      client:
        registration:
          org-service:
            provider: keycloak
            client-id: notification-service
            # Dev secret from infra/keycloak/realm-request-portal.json; real environments set NOTIFICATION_CLIENT_SECRET.
            client-secret: ${NOTIFICATION_CLIENT_SECRET:notification-service-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/request-portal/protocol/openid-connect/token

portal:
  events:
    topic: request-events
    dead-letter-topic: request-events.DLT
    partitions: 3
    replicas: 1
    processed-retention: 30d
  mail:
    from: "Request Portal <no-reply@request-portal.local>"
    # Links in emails point at the web app.
    portal-url: ${PORTAL_URL:http://localhost:5173}
    time-zone: Asia/Ho_Chi_Minh
  sender:
    poll-interval: 2s
    batch-size: 20
    max-attempts: 5
  reminders:
    interval: 5m
    due-soon-window: 24h
  org-service:
    url: ${ORG_SERVICE_URL:http://localhost:8081}
  cleanup-cron: "0 30 3 * * *"

server:
  port: 8084

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    # Spans are always created (trace ids appear in logs); exporting needs a collector, so it is opt-in.
    export:
      enabled: ${OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
  observations:
    enable:
      # Polling jobs run every few seconds; tracing each run would bury the real traces. The outbox relay
      # still traces each publish as part of the request that caused it.
      tasks.scheduled.execution: false
  metrics:
    distribution:
      # Histogram buckets, so dashboards can compute p95 and p99 across replicas.
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
