<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Shared wrapper: each email passes its own content block. -->
<div th:fragment="email(content)"
     style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.5; color: #1f2933; max-width: 560px;">
    <p style="font-size: 13px; color: #52606d; margin: 0 0 16px;">
        Request Portal · <span th:text="${code}">ACAD-0001</span>
    </p>
    <div th:replace="${content}">Content</div>
    <p style="margin: 24px 0;">
        <a th:href="${requestUrl}"
           style="background: #1d4ed8; color: #ffffff; padding: 10px 16px; border-radius: 6px; text-decoration: none;">
            Open the request
        </a>
    </p>
    <p style="font-size: 12px; color: #7b8794;">This is an automatic message; please do not reply.</p>
</div>
</body>
</html>
