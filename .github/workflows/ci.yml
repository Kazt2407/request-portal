name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build, test and publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Integration tests start PostgreSQL with Testcontainers, using the runner's Docker.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Images are published only from main, tagged with the commit and as latest.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for service in gateway org-service request-service document-service notification-service; do
            image="ghcr.io/$owner/request-portal/$service"
            docker build --build-arg SERVICE="$service" -t "$image:${{ github.sha }}" -t "$image:latest" .
            docker push --all-tags "$image"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: services/*/target/surefire-reports/

  infra:
    name: Validate docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f infra/docker-compose.yml config --quiet
